<style>

*{box-sizing:border-box}html{height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.45 Barlow,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}

.app{display:grid;grid-template-columns:96px 1fr;min-height:100%}

main{padding:14px 24px 24px;min-width:0}

.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.mut{color:var(--mut);font-size:13px}
.fl{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}

.tc.h{color:var(--tx);font-weight:600;line-height:1.2}.tc.h small{display:block;font-weight:400;color:var(--mut);font-size:10.5px}

.tc i{position:relative;z-index:1;display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 6px;background:var(--ok);border:2px solid var(--ok)}
.tc.todo i{background:var(--card)}.tc.cur i{background:#facc15;border-color:#e0a800;box-shadow:0 0 0 3px rgba(250,204,21,.3)}.tc.late i{background:var(--card);border-color:var(--bd)}.tc.cur.late i{background:var(--bd)}
.tc.done,.tc.cur{color:var(--tx)}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.tb input{flex:1 1 200px;padding:9px 12px}.tb select{padding:8px}

.lgb{width:100%;margin-top:20px;padding:16px;border:0;border-radius:6px;background:#17244a;color:#ffc72c;font-weight:700;letter-spacing:.05em;font-size:18px;cursor:pointer}.lgb:disabled{opacity:.6;cursor:default}
