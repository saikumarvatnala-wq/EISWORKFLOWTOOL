 return{email:p?p.email:"",sub:"EIS reminder: "+L.length+" milestone"+(L.length===1?"":"s")+" need attention",body:"Hi "+nm+",\n\nThese EIS milestones are overdue or due within 14 days:\n\n"+lines.join("\n")+(L.length>15?"\n...and "+(L.length-15)+" more":"")+"\n\nPlease update progress in the EIS Work Flow Tool: "+location.origin+location.pathname+"\n\nThank you,\n"+nice(prof.name||prof.email)}}

 return L.length?L.map(o=>{var c=cur(o),ix=O.indexOf(o),lm=o.eis?(o.eis.getFullYear()-o.start.getFullYear())*12+o.eis.getMonth()-o.start.getMonth()+" Months":"TBD";

function vOut(){return '<div class="card"><div class="ch"><span>EIS Overview</span></div><div class="tb"><input type="search" data-a="q" placeholder="Search customer, ICAO, country" aria-label="Search" value="'+e(q)+'"><select data-a="fprog" aria-label="Program"><option value="">All programs</option>'+PROGS.map(x=>'<option'+(fp===x?' selected':'')+'>'+x+'</option>').join("")+'</select><select data-a="fstat" aria-label="Status"><option value="">All statuses</option><option value="late"'+(fs==="late"?' selected':'')+'>Has delayed milestones</option><option value="ok"'+(fs==="ok"?' selected':'')+'>No delays</option></select><button class="sm" style="padding:8px 14px" data-a="xl">Export to Excel</button></div><div class="ol"><div class="olw"><div class="oh2"><span>Customer name</span><div class="tl">'+ST.map(s=>'<div class="tc h">'+s[0]+'<small>'+e(s[1])+'</small></div>').join("")+'</div><span>Onboarding lead time</span><span></span></div><div id="rows">'+rowsH()+'</div></div></div><div class="mut" style="margin-top:10px">Yellow marks the current milestone, green is complete, a red ring is delayed, and a dashed line is still ahead. Select a customer to open its tasks and documents.</div></div>'}

function vTasks(o){var s=ST[sel],n=o.t[sel].filter(Boolean).length,st=stt(o,sel);
 var h='<div class="card"><div class="row"><b>'+e(o.n)+'</b><select data-a="msel" aria-label="Milestone">'+ST.map((x,i)=>'<option value="'+i+'"'+(i===sel?' selected':'')+'>'+x[0]+': '+e(x[1])+'</option>').join("")+'</select><span class="tag '+st[0]+'">'+st[1]+'</span></div><div class="mut" style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">Due date <input type="date" data-a="mdate" value="'+iso(dt(o,sel))+'" aria-label="Milestone due date">'+(o.md[s[0]]?'<button class="sm" data-a="mreset">Reset to default</button>':'')+'<span>'+n+' of '+s[2].length+' tasks done</span>'+'</div><div class="bar"><i style="width:'+Math.round(n/s[2].length*100)+'%"></i></div>';
 s[2].forEach((t,j)=>{h+='<label class="tk'+(o.t[sel][j]?' d':'')+'"><input type="checkbox" data-a="chk" data-j="'+j+'"'+(o.t[sel][j]?' checked':'')+'><span>'+s[0]+'.'+(j+1)+' '+t+'</span></label>'});
 return h+'</div>'+docs(o,sel)}

 L.forEach(o=>{h+='<tr><td class="n">'+e(o.n)+'</td>'+ST.map((_,i)=>{var s=stt(o,i);return '<td><div class="hc tag '+s[0]+'" role="button" tabindex="0" title="'+s[1]+'" data-a="o" data-i="'+O.indexOf(o)+'" data-s="'+i+'">'+o.t[i].filter(Boolean).length+'/'+o.t[i].length+'</div></td>'}).join("")+'</tr>'});
 h+='</table></div><div class="card"><div class="ch"><span>Readiness by customer</span></div>'+L.slice().sort((a,b)=>pc(a)[0]-pc(b)[0]).map(o=>{var p=pc(o)[0];return '<div class="row"><span>'+e(o.n)+'</span><b>'+p+'%</b></div><div class="bar"><i style="width:'+p+'%"></i></div>'}).join("")+'</div>';return h}

 return '<div class="card"><div class="ch"><span>Add customer</span></div><div class="fm">'+[["fn","Customer name"],["fi","ICAO"],["fc","Country"],["fa","Number of aircraft","number"],["fo","Contract type"],["ft","Airframer or Lessor"],["fs2","Collins Flight Sens"],["fk","Kickoff date","date"],["fe","TOT","date"]].map(f=>'<label>'+f[1]+'<input id="'+f[0]+'" type="'+(f[2]||"text")+'"></label>').join("")+'<label>Engine program<select id="fpg">'+PROGS.map(x=>'<option>'+x+'</option>').join("")+'</select></label><label>Specialist<select id="fsp"><option value="">Not assigned</option>'+sp.map(p=>'<option value="'+p.id+'">'+e(p.name||p.email)+'</option>').join("")+'</select></label></div><button class="btn" style="margin-top:12px" data-a="addc">Save customer</button></div>'
 +'<div class="card"><div class="ch"><span>Import from Excel</span></div><p class="mut">Copy rows from Excel and paste them below, one customer per row, with these columns in this order: customer name, ICAO, country, engine program, number of aircraft, contract type, airframer or lessor, Collins Flight Sens, TOT, kickoff date, specialist email. Write dates as YYYY-MM-DD, for example 2027-04-20.</p><textarea id="imp" rows="6" aria-label="Pasted rows"></textarea><button class="btn" style="margin-top:10px" data-a="imp">Import customers</button></div>'}

 if(!role){a.innerHTML='<div class="login"><h1>EIS Work Flow Tool</h1><p class="mut">Sign in with your work email</p><input id="em" type="email" value="'+e(lem)+'" placeholder="Email" aria-label="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password"><div class="err" role="alert">'+e(lerr)+'</div><button class="btn" data-a="in"'+(busy?' disabled':'')+'>'+(busy?'Signing in...':'Sign in')+'</button><p class="mut">Access is by invitation. Ask your Chief Fleet Director for an account.</p></div>';return}
 var o=me(),cf=role==="cfd",nv=[["dash","Dashboard","&#9638;"],["tasks","Tasks","&#9745;"],["rc","Report Card","&#9636;"],["rem","Reminders","&#9993;"]];if(cf){nv.push(["add","Add customer","&#43;"]);nv.push(["ins","Insights","&#9684;"])}
 var ttl={dash:"Dashboard",tasks:"Tasks",tdet:"Tasks",ins:"Insights",add:"Add customer",rc:"Report Card",rem:"Reminders"}[view],b;

 a.innerHTML='<div class="app"><aside><div class="brand">P&amp;WA</div>'+nv.map(x=>'<button class="ni'+(view===x[0]||(view==="tdet"&&x[0]==="tasks")?' on':'')+'" data-a="v" data-v="'+x[0]+'"><i aria-hidden="true">'+x[2]+'</i>'+x[1]+'</button>').join("")+'</aside><main><div class="top"><div><small>EIS Work Flow Tool</small><h1>'+ttl+'</h1></div><div class="usr"><div><b>'+e(prof.name||prof.email)+'</b><span>'+(cf?"Chief Fleet Director":"EIS Specialist")+'</span></div><div class="av">'+e((prof.name||prof.email||"?").slice(0,2).toUpperCase())+'</div><button class="sm" data-a="out">Log out</button></div></div>'+b+'</main></div>'+(msg?'<div class="toast" role="status">'+e(msg)+'</div>':'');
 window.scrollTo(0,y);var c2=document.querySelector(".mss,.stp");if(c2)c2.scrollLeft=sx;

function act(x){var a=x.dataset.a,v=x.dataset.v,o=O[cid],i=+x.dataset.i,k=+x.dataset.k;
 if(a==="in")return login();if(a==="out")return logout();if(a==="v"||a==="oc"||a==="o"){editing=false;rcEdit=false}
 if(a==="v")view=v;else if(a==="sel")sel=i;else if(a==="dv"){sel=i;view="tdet"}
 else if(a==="flt")flt=flt===v?"":v;
 else if(a==="o"){cid=i;sel=+x.dataset.s;view="tdet"}
 else if(a==="oc"){cid=i;sel=cur(O[cid]);flt="";view="tdet"}
 else if(a==="ver")return setStatus(o,sel,k,"Verified");else if(a==="rej")return setStatus(o,sel,k,"Rejected");

 else if(a==="mreset")return resetMd(o,sel);

 else if(a==="remteams"){var m2=remText(x.dataset.k);window.open("https://teams.microsoft.com/l/chat/0/0?users="+encodeURIComponent(m2.email)+"&message="+encodeURIComponent(m2.sub+"\n\n"+m2.body),"_blank");return}
 else if(a==="remcopy"){var m3=remText(x.dataset.k);navigator.clipboard.writeText("Subject: "+m3.sub+"\n\n"+m3.body).then(()=>{msg="Reminder copied";render()},()=>{msg="Could not copy";render()});return}
 else if(a==="rcq"){var f=x.dataset.f;rcEdit=true;rcLogo=(RC[O[cid].id]||{}).logo||"";render();var t=document.getElementById(f);if(t){t.focus();if(t.setSelectionRange&&t.value)t.setSelectionRange(t.value.length,t.value.length)}return}
 else if(a==="rcedit"){rcEdit=true;rcLogo=(RC[O[cid].id]||{}).logo||""}else if(a==="rccancel")rcEdit=false;else if(a==="rcsave")return saveRc();else if(a==="rcprint"){window.print();return}else if(a==="rclogoclear"){rcLogo="";var lb=document.getElementById("lgbox");if(lb)lb.innerHTML=lgHtml();return}
 else if(a==="edit")editing=true;else if(a==="ecancel")editing=false;else if(a==="esave")return saveEdit();
